services:
  audit:
    image: ghcr.io/slmingol/uptime-kuma-pfsense-sync:latest
    restart: unless-stopped
    ports:
      - "${AUDIT_PORT:-3210}:3000"
    env_file: .env
    environment:
      - UPTIME_KUMA_CONFIG=/config/uptime-kuma-config.json
      # Override schedule (default: 08:00 daily). Standard cron syntax.
      - AUDIT_CRON=${AUDIT_CRON:-0 8 * * *}
      # To ignore extra services at runtime, mount a custom ignore file:
      # - AUDIT_IGNORE_FILE=/config/audit-ignore.json
    volumes:
      - ./config/uptime-kuma-config.json:/config/uptime-kuma-config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
